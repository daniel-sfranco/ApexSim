[alembic]
script_location = migrations
# Coloca a pasta backend/ no sys.path para o env.py conseguir importar `db` e `app`.
prepend_sys_path = .
path_separator = os
# Nomes com data e hora deixam as migrations em ordem cronológica no `ls`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# A URL NÃO fica aqui: o env.py lê DATABASE_URL (a mesma variável que a API usa).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
