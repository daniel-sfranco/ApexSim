[project]
name = "apexsim-backend"
version = "0.1.0"
description = "ApexSim — backend do simulador de Fórmula 1 (MC857)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastf1>=3.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    # Banco de dados. SQLAlchemy 2 + Alembic é o combo exigido pelo roadmap
    # ("migrations com Alembic desde o primeiro dia"). psycopg[binary] é o
    # driver PostgreSQL mantido (v3) e já traz a libpq, então a imagem slim
    # não precisa de libpq-dev.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
