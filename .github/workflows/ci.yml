name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Os testes de geometria rodam sobre fixture congelada em disco, nunca
      # contra a rede: o FastF1/Jolpica tem rate limit baixo e o CI derrubaria.
      - name: Testes
        run: uv run pytest
