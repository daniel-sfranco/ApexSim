name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Os testes de banco rodam contra um PostgreSQL real, não contra mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apexsim
          POSTGRES_PASSWORD: apexsim
          POSTGRES_DB: apexsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apexsim -d apexsim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://apexsim:apexsim@localhost:5432/apexsim

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Os testes de geometria rodam sobre fixture congelada em disco, nunca
      # contra a rede: o FastF1/Jolpica tem rate limit baixo e o CI derrubaria.
      - name: Testes
        run: uv run pytest
